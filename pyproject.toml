[project]
name = "self-improving-multimodal-code-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "alembic>=1.18.5",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.5.3",
    "langfuse>=4,<5",
    "langgraph>=1.2.10",
    "pgvector>=0.3",
    "playwright>=1.62.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-redis>=4.6.0.20241004",
]
eval = [
    "datasets>=5.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/**" = ["E501"]
"app/ingestion/retriever.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.12.13"
strict = true
warn_unused_ignores = true
exclude = ["^tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
